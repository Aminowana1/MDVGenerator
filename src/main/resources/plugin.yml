name: MDVGenerator
version: '2.0.0'
main: dev.mira.worldgen.MDVGenerator
api-version: '1.21.6'
description: Diseñá biomas, plantillas y dimensiones desde el juego.
commands:
  mdv:
    description: Proyectos de generación de mundos.
    aliases: [gm, mdvgenerator, generamundos]
permissions:
  mdvgenerator.admin:
    description: Permite diseñar, exportar e instalar proyectos de MDVGenerator.
    default: op
  generamundos.admin:
    description: Permiso anterior compatible con MDVGenerator.
    default: false
