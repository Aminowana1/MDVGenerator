name: MDVDimensions
version: '2.2.2'
main: dev.mira.worldgen.MDVDimensions
api-version: '1.21.6'
load: STARTUP
softdepend: [ViaVersion]
description: Diseñá biomas, plantillas y dimensiones desde el juego.
commands:
  dim:
    description: Proyectos de generación de mundos.
permissions:
  mdvdimensions.admin:
    description: Permite diseñar, exportar e instalar proyectos de MDVDimensions.
    default: op
  mdvgenerator.admin:
    description: Permiso anterior compatible con MDVDimensions.
    default: false
  generamundos.admin:
    description: Permiso anterior compatible con MDVDimensions.
    default: false
